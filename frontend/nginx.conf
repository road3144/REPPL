server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA - 모든 경로를 index.html로 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐시
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}