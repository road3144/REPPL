# HTTPS
server {
    listen 443 ssl;
    server_name ${EC2_HOST};

    ssl_certificate /etc/letsencrypt/live/${EC2_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${EC2_HOST}/privkey.pem;

    # Docker 내장 DNS (컨테이너 IP 변경 시 자동 재해석)
    resolver 127.0.0.11 valid=10s;

    # 요청 크기 제한 (영상 업로드 고려)
    client_max_body_size 500M;

    # REST API
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # WebSocket (STOMP /ws)
    location /ws {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Frontend (React SPA)
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}
