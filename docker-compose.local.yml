version: '3.8'

services:

  # ─── Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # ─── Frontend (React + Vite) ──────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend

  # ─── Backend (Spring Boot) ────────────────────────────────────
  backend:
    build: ./backend
    container_name: backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_TIMEOUT: 86400s
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: reppl-spring
      KAFKA_TOPIC_JOB_REQUEST: reppl.job.request.v1
      KAFKA_TOPIC_JOB_REQUEST_PARTITIONS: 3
      KAFKA_TOPIC_JOB_PROGRESS: reppl.job.progress.v1
      KAFKA_TOPIC_JOB_PROGRESS_PARTITIONS: 3
      AWS_ACCESS_KEY: # 여기에 값 입력
      AWS_SECRET_KEY: # 여기에 값 입력
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: # 여기에 값 입력
    depends_on:
      - redis
      - kafka

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ─── Zookeeper ────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  # ─── Kafka ────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  redis_data:
  kafka_data:
  zookeeper_data:
