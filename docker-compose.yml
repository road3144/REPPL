version: '3.8'

services:

  # ─── Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    environment:
      EC2_HOST: ${EC2_HOST}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ─── SSL 인증서 (Let's Encrypt) ─────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # ─── Frontend (React + Vite) ──────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE}:${TAG:-latest}
    container_name: frontend
    restart: unless-stopped

  # ─── Backend (Spring Boot) ────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE}:${TAG:-latest}
    container_name: backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_TIMEOUT: 86400s
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: reppl-spring
      KAFKA_TOPIC_JOB_REQUEST: reppl.job.request.v1
      KAFKA_TOPIC_JOB_REQUEST_PARTITIONS: 3
      KAFKA_TOPIC_JOB_PROGRESS: reppl.job.progress.v1
      KAFKA_TOPIC_JOB_PROGRESS_PARTITIONS: 3
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    depends_on:
      - redis
      - kafka
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ─── Zookeeper ────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    restart: unless-stopped

  # ─── Kafka ────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      # EC2 외부(GPU 서버)에서 접근할 때 사용: EC2_HOST:9092
      - "9092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT: Docker 내부 통신 (컨테이너 포트 9092)
      # PLAINTEXT_HOST: 외부(GPU 서버) 통신 (컨테이너 포트 29092 → 호스트 포트 9092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://${EC2_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

volumes:
  redis_data:
  kafka_data:
  zookeeper_data:
  certbot_www:
    external: true
  certbot_conf:
    external: true
