version: '3.8'

services:

  # ─── Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ─── Frontend (React + Vite) ──────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE}:${TAG:-latest}
    container_name: frontend
    restart: unless-stopped

  # ─── Backend (Spring Boot) ────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE}:${TAG:-latest}
    container_name: backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_TIMEOUT: 86400s
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: reppl-spring
      KAFKA_TOPIC_JOB_REQUEST: reppl.job.request.v1
      KAFKA_TOPIC_JOB_REQUEST_PARTITIONS: 3
      KAFKA_TOPIC_JOB_PROGRESS: reppl.job.progress.v1
      KAFKA_TOPIC_JOB_PROGRESS_PARTITIONS: 3
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    depends_on:
      - redis
      - kafka
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ─── Zookeeper ────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    restart: unless-stopped

  # ─── Kafka ────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      # EC2 외부(GPU 서버)에서 접근할 때 사용: EC2_HOST:29092
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT: Docker 내부 통신, PLAINTEXT_HOST: 외부(GPU 서버) 통신
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://${EC2_HOST:-localhost}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

volumes:
  redis_data:
  kafka_data:
  zookeeper_data: