stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY_IMAGE: $DOCKER_HUB_USER/s14p21a401

# ─── Build Backend ────────────────────────────────────────────────────────────
build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
  script:
    - docker build -t $REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA -t $REGISTRY_IMAGE/backend:latest ./backend
    - docker push $REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_IMAGE/backend:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"

# ─── Build Frontend ───────────────────────────────────────────────────────────
build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
  script:
    - docker build -t $REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA -t $REGISTRY_IMAGE/frontend:latest ./frontend
    - docker push $REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_IMAGE/frontend:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"

# ─── Deploy to EC2 ────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - ssh ubuntu@$EC2_HOST "mkdir -p ~/app/nginx"
    - scp docker-compose.yml ubuntu@$EC2_HOST:~/app/docker-compose.yml
    - scp nginx/nginx.conf ubuntu@$EC2_HOST:~/app/nginx/nginx.conf
    - |
      ssh ubuntu@$EC2_HOST "
        cd ~/app
        cat > .env << ENVEOF
REGISTRY_IMAGE=$REGISTRY_IMAGE
TAG=$CI_COMMIT_SHORT_SHA
EC2_HOST=$EC2_HOST
AWS_ACCESS_KEY=$AWS_ACCESS_KEY
AWS_SECRET_KEY=$AWS_SECRET_KEY
AWS_REGION=$AWS_REGION
AWS_S3_BUCKET=$AWS_S3_BUCKET
ENVEOF
        docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
        docker compose pull
        docker compose up -d --remove-orphans
        docker image prune -f
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment:
    name: production
    url: http://$EC2_HOST