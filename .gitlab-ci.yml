stages:
  - build
  - deploy

variables:
  REGISTRY_IMAGE: $DOCKER_HUB_USER/s14p21a401

# ─── Build Backend ────────────────────────────────────────────────────────────
build-backend:
  stage: build
  script:
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
    - docker build -t $REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA -t $REGISTRY_IMAGE/backend:latest ./backend
    - docker push $REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_IMAGE/backend:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"

# ─── Build Frontend ───────────────────────────────────────────────────────────
build-frontend:
  stage: build
  script:
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
    - docker build -t $REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA -t $REGISTRY_IMAGE/frontend:latest ./frontend
    - docker push $REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_IMAGE/frontend:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"

# ─── Deploy ───────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  script:
    - mkdir -p ~/app/nginx
    - cp docker-compose.yml ~/app/docker-compose.yml
    - cp nginx/nginx.conf ~/app/nginx/nginx.conf
    - |
      printf 'REGISTRY_IMAGE=%s\nTAG=%s\nEC2_HOST=%s\nAWS_ACCESS_KEY=%s\nAWS_SECRET_KEY=%s\nAWS_REGION=%s\nAWS_S3_BUCKET=%s\n' \
        "$REGISTRY_IMAGE" "$CI_COMMIT_SHORT_SHA" "$EC2_HOST" \
        "$AWS_ACCESS_KEY" "$AWS_SECRET_KEY" "$AWS_REGION" "$AWS_S3_BUCKET" \
        > ~/app/.env
    - cd ~/app
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
    - docker compose pull
    - docker compose up -d --remove-orphans
    - docker image prune -f
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment:
    name: production
    url: http://$EC2_HOST