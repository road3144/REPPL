stages:
  - build
  - deploy

variables:
  BACKEND_IMAGE: $DOCKER_HUB_USER/reppl-backend
  FRONTEND_IMAGE: $DOCKER_HUB_USER/reppl-frontend

# ─── Build Backend ────────────────────────────────────────────────────────────
build-backend:
  stage: build
  script:
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA ./backend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"

# ─── Build Frontend ───────────────────────────────────────────────────────────
build-frontend:
  stage: build
  script:
    - docker build -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA ./frontend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"

# ─── Deploy ───────────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  script:
    # 이미지 태깅 및 푸시
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
    - docker tag $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:latest
    - docker tag $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
    # .env 생성 및 배포
    - mkdir -p ~/app/nginx
    - cp docker-compose.yml ~/app/docker-compose.yml
    - cp nginx/nginx.conf ~/app/nginx/nginx.conf
    - |
      printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\nTAG=%s\nEC2_HOST=%s\nAWS_ACCESS_KEY=%s\nAWS_SECRET_KEY=%s\nAWS_REGION=%s\nAWS_S3_BUCKET=%s\n' \
        "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$CI_COMMIT_SHORT_SHA" "$EC2_HOST" \
        "$AWS_ACCESS_KEY" "$AWS_SECRET_KEY" "$AWS_REGION" "$AWS_S3_BUCKET" \
        > ~/app/.env
    - cd ~/app
    - docker compose pull
    - docker compose up -d --remove-orphans
    # 이전 이미지 정리
    - docker image prune -af --filter "until=1h"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment:
    name: production
    url: https://$EC2_HOST
